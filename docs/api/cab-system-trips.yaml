openapi: 3.0.3
info:
  title: CAB System API - Trips
  version: 1.0.0
  description: |-
    Module chuyến đi của CAB System. Quản lý đặt xe, tìm tài xế, phân công, theo dõi và hủy chuyến.
servers:
  - url: https://api.cab-system.local/v1
paths:
  /trips:
    post:
      tags: [Trips]
      summary: Tạo yêu cầu đặt xe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreateRequest"
      responses:
        "201":
          description: Yêu cầu đặt xe được tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
    get:
      tags: [Trips]
      summary: Liệt kê chuyến đi
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                requested,
                assigning,
                assigned,
                accepted,
                started,
                completed,
                cancel,
              ]
      responses:
        "200":
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripListResponse"

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: Lấy chi tiết chuyến đi
      parameters:
        - $ref: "#/components/parameters/TripIdParam"
      responses:
        "200":
          description: Chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404":
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Trips]
      summary: Cập nhật trạng thái chuyến đi
      parameters:
        - $ref: "#/components/parameters/TripIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStatusUpdateRequest"
      responses:
        "200":
          description: Chuyến đi cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{tripId}/assign:
    post:
      tags: [Trips]
      summary: Phân công tài xế cho chuyến đi
      parameters:
        - $ref: "#/components/parameters/TripIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripAssignRequest"
      responses:
        "200":
          description: Chuyến đi được gán cho tài xế
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{tripId}/estimate:
    get:
      tags: [Trips]
      summary: Ước tính cước và thời gian tài xế đến
      parameters:
        - $ref: "#/components/parameters/TripIdParam"
      responses:
        "200":
          description: Thông tin ước tính
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripEstimateResponse"

  /trips/{tripId}/cancel:
    post:
      tags: [Trips]
      summary: Hủy chuyến đi
      parameters:
        - $ref: "#/components/parameters/TripIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCancelRequest"
      responses:
        "200":
          description: Chuyến đi được hủy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
components:
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
    TripIdParam:
      name: tripId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
    TripCreateRequest:
      type: object
      required: [customerId, pickup, destination, serviceType]
      properties:
        customerId:
          type: string
        pickup:
          $ref: "#/components/schemas/Location"
        destination:
          $ref: "#/components/schemas/Location"
        serviceType:
          type: string
          enum: [standard, vip, airport, package]
        requestedAt:
          type: string
          format: date-time
    TripAssignRequest:
      type: object
      required: [driverId]
      properties:
        driverId:
          type: string
    TripCancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    TripStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
            [
              requested,
              assigning,
              assigned,
              accepted,
              started,
              completed,
              cancel,
            ]
        reason:
          type: string
    Trip:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        driverId:
          type: string
        pickup:
          $ref: "#/components/schemas/Location"
        destination:
          $ref: "#/components/schemas/Location"
        serviceType:
          type: string
        status:
          type: string
          enum:
            [
              requested,
              assigning,
              assigned,
              accepted,
              started,
              completed,
              cancel,
            ]
        fare:
          type: number
          format: double
        estimatedArriveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    TripEstimateResponse:
      type: object
      properties:
        tripId:
          type: string
        estimatedFare:
          type: number
          format: double
        estimatedDurationMinutes:
          type: integer
        estimatedDriverArrivalAt:
          type: string
          format: date-time
        distanceKm:
          type: number
          format: double
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
